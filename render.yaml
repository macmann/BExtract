services:
  - type: web
    name: bextractor
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
